name: Build MercureTools
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onefile --windowed --name MercureTools --collect-all customtkinter main.py
      - uses: actions/upload-artifact@v4
        with:
          name: MercureTools
          path: dist/MercureTools.exe
