name: Build MercureTools

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pillow pyinstaller

      - name: Check logo.ico
        shell: pwsh
        run: |
          if (-not (Test-Path "logo.ico")) { Write-Error "logo.ico est introuvable a la racine du depot"; exit 1 }

      - name: Build exe with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name MercureTools `
            --icon "logo.ico" `
            --add-data "logo.ico;." `
            --collect-all customtkinter `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MercureTools-windows
          path: dist/MercureTools.exe

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MercureTools.exe
